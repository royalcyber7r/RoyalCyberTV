name: Build RoyalCyberTV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoyalCyberTV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoyalCyberTV
          path: RoyalCyberTV.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" RoyalCyberTV.apk \
            --title "RoyalCyberTV APK #${{ github.run_number }}" \
            --notes "Automatic build from GitHub Actions" \
            --latest

