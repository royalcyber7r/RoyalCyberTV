name: Build RoyalCyberTV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup JDK 17
      # ==========================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==========================================
      # 3. Setup Gradle 8.11.1
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # ==========================================
      # 4. Setup Android SDK / Build Tools
      # ==========================================

      - name: Setup Android SDK
        shell: bash
        run: |

          echo "=========================================="
          echo "Checking Android SDK"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not set}"

          echo ""

          if [ -d "${ANDROID_HOME:-}" ]; then
            echo "Android SDK found."
          else
            echo "ERROR: Android SDK was not found!"
            exit 1
          fi

          echo "=========================================="


      # ==========================================
      # 5. Generate Automatic Version
      # ==========================================

      - name: Generate Version
        id: version
        shell: bash
        run: |

          BUILD_NUMBER="${{ github.run_number }}"

          VERSION_CODE="$BUILD_NUMBER"

          VERSION_NAME="1.0.${BUILD_NUMBER}"

          echo "=========================================="
          echo "RoyalCyberTV Version Information"
          echo "=========================================="
          echo "Build Number : $BUILD_NUMBER"
          echo "Version Code : $VERSION_CODE"
          echo "Version Name : $VERSION_NAME"
          echo "=========================================="

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 6. Check Gradle
      # ==========================================

      - name: Check Gradle
        shell: bash
        run: |

          echo "=========================================="
          echo "Gradle Information"
          echo "=========================================="

          gradle --version

          echo "=========================================="


      # ==========================================
      # 7. Verify Release Keystore
      # ==========================================

      - name: Verify Release Keystore
        shell: bash
        run: |

          KEYSTORE_PATH="$GITHUB_WORKSPACE/royalcyber-release.jks"

          echo "=========================================="
          echo "Checking Release Keystore"
          echo "=========================================="

          echo "Expected path:"
          echo "$KEYSTORE_PATH"

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: royalcyber-release.jks was not found!"
            echo ""
            echo "Repository root contents:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: royalcyber-release.jks is empty!"
            exit 1
          fi

          echo ""
          echo "Keystore found successfully:"
          ls -lh "$KEYSTORE_PATH"

          echo "=========================================="


      # ==========================================
      # 8. Verify Keystore Credentials
      # ==========================================

      - name: Verify Keystore Credentials
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |

          KEYSTORE_PATH="$GITHUB_WORKSPACE/royalcyber-release.jks"

          echo "=========================================="
          echo "Verifying Release Keystore"
          echo "=========================================="

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing!"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing!"
            exit 1
          fi

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          if [ $? -ne 0 ]; then
            echo "ERROR: Keystore verification failed!"
            echo "Check KEYSTORE_PASSWORD and KEY_ALIAS."
            exit 1
          fi

          echo ""
          echo "Keystore credentials verified successfully."

          echo "=========================================="


      # ==========================================
      # 9. Build Signed Release APK
      # ==========================================

      - name: Build Signed Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |

          KEYSTORE_PATH="$GITHUB_WORKSPACE/royalcyber-release.jks"

          echo "=========================================="
          echo "Building Signed Release APK"
          echo "=========================================="

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing!"
            exit 1
          fi

          echo "Keystore:"
          echo "$KEYSTORE_PATH"

          gradle assembleRelease \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PRELEASE_STORE_FILE="$KEYSTORE_PATH" \
            -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "Release build completed."
          echo "=========================================="


      # ==========================================
      # 10. Check Release APK
      # ==========================================

      - name: Check Release APK
        shell: bash
        run: |

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          echo "=========================================="
          echo "Checking Release APK"
          echo "=========================================="

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated!"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Release APK is empty!"
            exit 1
          fi

          echo ""
          echo "Release APK successfully generated!"

          ls -lh "$APK_PATH"

          echo "=========================================="


      # ==========================================
      # 11. Rename APK
      # ==========================================
      #
      # দুটি নাম তৈরি হবে:
      #
      # 1. RoyalCyberTV-1.0.X.apk
      # 2. RoyalCyberTV.apk
      #
      # দুটোই একই signed APK
      #
      # পুরোনো UpdateActivity:
      # RoyalCyberTV.apk
      #
      # নতুন UpdateActivity:
      # RoyalCyberTV-1.0.X.apk
      #
      # ==========================================

      - name: Rename APK
        shell: bash
        run: |

          mkdir -p release

          VERSIONED_APK="release/RoyalCyberTV-${{ steps.version.outputs.version_name }}.apk"

          GENERIC_APK="release/RoyalCyberTV.apk"

          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"

          cp \
            "$SOURCE_APK" \
            "$VERSIONED_APK"

          cp \
            "$SOURCE_APK" \
            "$GENERIC_APK"

          echo "=========================================="
          echo "Final APK Files"
          echo "=========================================="

          echo ""
          echo "Versioned APK:"
          ls -lh "$VERSIONED_APK"

          echo ""
          echo "Generic APK:"
          ls -lh "$GENERIC_APK"

          echo ""
          echo "Both APK files are copies of the SAME signed APK."

          echo "=========================================="


      # ==========================================
      # 12. Verify APK Version Information
      # ==========================================

      - name: Verify APK Version Information
        shell: bash
        run: |

          echo "=========================================="
          echo "Verifying APK Version"
          echo "=========================================="

          VERSION_CODE="${{ steps.version.outputs.version_code }}"

          VERSION_NAME="${{ steps.version.outputs.version_name }}"

          echo ""
          echo "Expected Version Code:"
          echo "$VERSION_CODE"

          echo ""
          echo "Expected Version Name:"
          echo "$VERSION_NAME"

          echo ""
          echo "Application ID:"
          echo "live.royalcyber.tv"

          echo ""
          echo "APK files:"
          ls -lh release/

          echo "=========================================="


      # ==========================================
      # 13. Locate apksigner
      # ==========================================

      - name: Locate APK Signer
        id: apksigner
        shell: bash
        run: |

          echo "=========================================="
          echo "Locating apksigner"
          echo "=========================================="

          APKSIGNER=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then

            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              2>/dev/null \
              | sort -V \
              | tail -n 1)"

          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found in Android SDK!"
            echo ""
            echo "Android SDK:"
            echo "${ANDROID_HOME:-not set}"
            echo ""
            echo "Available build-tools:"

            if [ -d "${ANDROID_HOME:-}/build-tools" ]; then
              ls -la "$ANDROID_HOME/build-tools"
            fi

            exit 1
          fi

          echo "apksigner found:"
          echo "$APKSIGNER"

          echo "apksigner_path=$APKSIGNER" >> "$GITHUB_OUTPUT"

          echo "=========================================="


      # ==========================================
      # 14. Verify APK Signing
      # ==========================================

      - name: Verify APK Signing
        shell: bash
        run: |

          VERSIONED_APK="release/RoyalCyberTV-${{ steps.version.outputs.version_name }}.apk"

          GENERIC_APK="release/RoyalCyberTV.apk"

          APKSIGNER="${{ steps.apksigner.outputs.apksigner_path }}"

          echo "=========================================="
          echo "Checking APK Signatures"
          echo "=========================================="

          if [ ! -f "$VERSIONED_APK" ]; then
            echo "ERROR: Versioned APK was not found!"
            exit 1
          fi

          if [ ! -f "$GENERIC_APK" ]; then
            echo "ERROR: Generic APK was not found!"
            exit 1
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner path is empty!"
            exit 1
          fi

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner executable was not found!"
            echo "$APKSIGNER"
            exit 1
          fi

          echo ""
          echo "Verifying Versioned APK..."

          "$APKSIGNER" verify \
            --verbose \
            "$VERSIONED_APK"

          echo ""
          echo "Versioned APK signature verified."

          echo ""
          echo "Verifying Generic APK..."

          "$APKSIGNER" verify \
            --verbose \
            "$GENERIC_APK"

          echo ""
          echo "Generic APK signature verified."

          echo ""
          echo "=========================================="
          echo "Both APK signatures verified successfully."
          echo "=========================================="


      # ==========================================
      # 15. Upload GitHub Actions Artifact
      # ==========================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:

          name: RoyalCyberTV-Release-${{ steps.version.outputs.version_code }}

          path: |
            release/RoyalCyberTV-${{ steps.version.outputs.version_name }}.apk
            release/RoyalCyberTV.apk

          if-no-files-found: error

          retention-days: 30


      # ==========================================
      # 16. Create GitHub Release
      # ==========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: v${{ steps.version.outputs.version_name }}

          name: RoyalCyberTV v${{ steps.version.outputs.version_name }}

          body: |
            RoyalCyberTV Android Application

            ==========================================

            Version Code:
            ${{ steps.version.outputs.version_code }}

            Version Name:
            ${{ steps.version.outputs.version_name }}

            Build Number:
            ${{ github.run_number }}

            ==========================================

            Application ID:
            live.royalcyber.tv

            ==========================================

            Signed Release APK

            This APK is digitally signed with the
            RoyalCyberTV release signing key.

            ==========================================

            Update Support

            RoyalCyberTV.apk
            is included for compatibility with
            older versions of the automatic updater.

            The versioned APK is also included:

            RoyalCyberTV-${{ steps.version.outputs.version_name }}.apk

          files: |
            release/RoyalCyberTV-${{ steps.version.outputs.version_name }}.apk
            release/RoyalCyberTV.apk

          generate_release_notes: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # 17. Build Completed
      # ==========================================

      - name: Build Completed
        if: success()
        shell: bash
        run: |

          echo "=========================================="
          echo "ROYALCYBERTV APK BUILD SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Version Code:"
          echo "${{ steps.version.outputs.version_code }}"

          echo ""
          echo "Version Name:"
          echo "${{ steps.version.outputs.version_name }}"

          echo ""
          echo "Application ID:"
          echo "live.royalcyber.tv"

          echo ""
          echo "APK Files:"
          ls -lh release/

          echo ""
          echo "GitHub Release:"
          echo "v${{ steps.version.outputs.version_name }}"

          echo ""
          echo "Automatic Update:"
          echo "RoyalCyberTV.apk = ENABLED"

          echo ""
          echo "=========================================="
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo "=========================================="
