name: Build RoyalCyberTV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup JDK 17
      # ==========================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==========================================
      # 3. Setup Gradle
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # ==========================================
      # 4. Generate Automatic Version
      # ==========================================

      - name: Generate Version
        id: version
        shell: bash
        run: |

          BUILD_NUMBER="${{ github.run_number }}"

          VERSION_CODE="$BUILD_NUMBER"

          VERSION_NAME="1.0.${BUILD_NUMBER}"

          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "VERSION_CODE=$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 5. Build Debug APK
      # ==========================================

      - name: Build APK
        run: |

          ./gradlew assembleDebug \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            --stacktrace


      # ==========================================
      # 6. Rename APK
      # ==========================================

      - name: Rename APK
        shell: bash
        run: |

          BUILD_NUMBER="${{ steps.version.outputs.version_code }}"

          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "release/RoyalCyberTV.apk"

          echo "APK:"
          ls -lh release/RoyalCyberTV.apk


      # ==========================================
      # 7. Upload Artifact
      # ==========================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoyalCyberTV-Build-${{ steps.version.outputs.version_code }}
          path: release/RoyalCyberTV.apk
          if-no-files-found: error


      # ==========================================
      # 8. Create GitHub Release
      # ==========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: build-${{ steps.version.outputs.version_code }}

          name: RoyalCyberTV APK #${{ steps.version.outputs.version_code }}

          body: |
            Automatic build from GitHub Actions

            Version Code: ${{ steps.version.outputs.version_code }}

            Version Name: ${{ steps.version.outputs.version_name }}

          files: |
            release/RoyalCyberTV.apk

          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
