name: Create RoyalCyberTV Signing Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  create-key:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Create Permanent Keystore
        shell: bash
        run: |

          if [ -f "royalcyber-release.jks" ]; then

            echo "=========================================="
            echo "Keystore already exists."
            echo "Will NOT create a new key."
            echo "=========================================="

            exit 0

          fi


          keytool -genkeypair \
            -v \
            -keystore royalcyber-release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias royalcyber \
            -storepass RoyalCyber@2026 \
            -keypass RoyalCyber@2026 \
            -dname "CN=RoyalCyberTV, OU=RoyalCyber, O=RoyalCyber, L=Dhaka, ST=Dhaka, C=BD"


          echo "=========================================="
          echo "RoyalCyberTV signing key created."
          echo "=========================================="


      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:

          name: RoyalCyberTV-Signing-Key

          path: royalcyber-release.jks

          if-no-files-found: error


      - name: Save Keystore In Repository
        shell: bash
        run: |

          if [ -f "royalcyber-release.jks" ]; then

            git config user.name "RoyalCyberTV"

            git config user.email "actions@github.com"

            git add royalcyber-release.jks

            git diff --cached --quiet || \
              git commit -m "Add permanent RoyalCyberTV signing key"

            git push || true

          fi
